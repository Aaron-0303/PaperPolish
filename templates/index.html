<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PaperPolish</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <div>
          <div class="brand">PaperPolish</div>
          <div class="brand-subtitle">论文双语润色工作台</div>
        </div>
        <button class="icon-button mobile-only" id="closeSidebar" aria-label="关闭侧边栏">×</button>
      </div>

      <nav class="nav-tabs" aria-label="侧边栏功能">
        <button class="nav-item active" data-panel="workspace">段落工作台</button>
        <button class="nav-item" data-panel="terms">术语库</button>
        <button class="nav-item" data-panel="history">历史记录</button>
        <button class="nav-item" data-panel="settings">设置</button>
      </nav>

      <section class="side-panel" data-side-panel="terms" hidden>
        <div class="section-heading">术语库</div>
        <p class="muted">Locked 术语在翻译与重写时保持固定。</p>
        <div id="termList" class="term-list"></div>
        <button class="secondary-button full-width" id="addTerm">+ 添加术语</button>
      </section>

      <section class="side-panel" data-side-panel="history" hidden>
        <div class="section-heading">历史记录</div>
        <p class="muted">保存当前段落后，可在这里快速恢复。</p>
        <div id="historyList" class="history-list"></div>
      </section>

      <section class="side-panel" data-side-panel="settings" hidden>
        <div class="section-heading">写作设置</div>
        <label class="field-label" for="styleProfile">英文写作风格</label>
        <textarea id="styleProfile" class="small-textarea">CVPR/IEEE concise academic style. Technically precise, concise, no unnecessary adjectives, no inflated claims.</textarea>
        <div class="config-status" id="configStatus">正在读取模型配置…</div>
      </section>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="icon-button mobile-only" id="openSidebar" aria-label="打开侧边栏">☰</button>
        <div>
          <h1>段落工作台</h1>
          <p>英文原文 → 中文修改 → 学术英文</p>
        </div>
        <div class="top-actions">
          <button class="secondary-button" id="newParagraph">新段落</button>
          <button class="primary-button" id="saveParagraph">保存段落</button>
        </div>
      </header>

      <section class="workspace-grid">
        <article class="editor-card">
          <div class="editor-header">
            <div>
              <span class="step">01</span>
              <h2>英文原文</h2>
            </div>
            <button class="text-button" data-copy="sourceText">复制</button>
          </div>
          <textarea id="sourceText" placeholder="粘贴需要润色的英文论文段落…" spellcheck="false"></textarea>
          <div class="editor-footer">
            <span id="sourceCount">0 words</span>
            <button class="primary-button compact" id="translateButton">翻译为中文 →</button>
          </div>
        </article>

        <article class="editor-card focus-card">
          <div class="editor-header">
            <div>
              <span class="step">02</span>
              <h2>中文修改</h2>
            </div>
            <button class="text-button" data-copy="chineseText">复制</button>
          </div>
          <textarea id="chineseText" placeholder="翻译结果会出现在这里。你只需要修改中文，让它准确表达你的技术含义。"></textarea>
          <div class="editor-footer">
            <span id="chineseCount">0 字</span>
            <button class="primary-button compact" id="rewriteButton">生成学术英文 →</button>
          </div>
        </article>

        <article class="editor-card">
          <div class="editor-header">
            <div>
              <span class="step">03</span>
              <h2>最终英文</h2>
            </div>
            <button class="text-button" data-copy="finalText">复制</button>
          </div>
          <textarea id="finalText" placeholder="最终学术英文会出现在这里…" spellcheck="false"></textarea>
          <div class="editor-footer">
            <span id="finalCount">0 words</span>
            <button class="secondary-button compact" id="rewriteAgain">重新生成</button>
          </div>
        </article>
      </section>

      <section class="diff-section">
        <button class="diff-toggle" id="diffToggle" aria-expanded="false">
          <span>原文 / 最终英文 Diff</span>
          <span id="diffChevron">⌄</span>
        </button>
        <div class="diff-content" id="diffContent" hidden>
          <div class="diff-columns">
            <div>
              <div class="diff-label">原文</div>
              <pre id="diffOriginal">暂无内容</pre>
            </div>
            <div>
              <div class="diff-label">最终英文</div>
              <pre id="diffFinal">暂无内容</pre>
            </div>
          </div>
        </div>
      </section>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>
  </div>

  <div class="modal-backdrop" id="termModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="termModalTitle">
      <div class="modal-header">
        <h2 id="termModalTitle">添加术语</h2>
        <button class="icon-button" id="closeTermModal" aria-label="关闭">×</button>
      </div>
      <label class="field-label" for="termEnglish">英文术语</label>
      <input id="termEnglish" type="text" placeholder="例如 Next-Best View">
      <label class="field-label" for="termChinese">中文对应</label>
      <input id="termChinese" type="text" placeholder="例如 下一最佳视点">
      <label class="field-label" for="termType">规则</label>
      <select id="termType">
        <option value="locked">Locked - 固定不改</option>
        <option value="preferred">Preferred - 优先使用</option>
      </select>
      <button class="primary-button full-width" id="saveTerm">保存术语</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
