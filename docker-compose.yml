services:
  backend:
    build:
      context: ./backend
    container_name: paperpolish-backend
    restart: unless-stopped
    environment:
      NVIDIA_VISIBLE_DEVICES: "3"
      HOST_GPU_INDEX: "3"
      MODEL_ID: ${MODEL_ID:-tencent/Hy-MT2-7B}
      MODEL_DIR: /models/Hy-MT2-7B
      MODEL_DTYPE: ${MODEL_DTYPE:-bfloat16}
      MAX_NEW_TOKENS: ${MAX_NEW_TOKENS:-4096}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      PROVIDER_SECRETS_FILE: /data/provider-secrets.json
    volumes:
      - ./models:/models
      - ./data:/data
    ports:
      - "${API_PORT:-30480}:8000"
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["3"]
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
    container_name: paperpolish-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-30430}:80"
